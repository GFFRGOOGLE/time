<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точное московское время (эталон GitHub)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; background-color: #0d1117; color: #c9d1d9;
        }
        h1 { font-weight: 300; letter-spacing: 2px; color: #8b949e; }
        .clock {
            font-size: 6rem; font-variant-numeric: tabular-nums; font-weight: 700;
            color: #58a6ff; text-shadow: 0 0 20px rgba(88, 166, 255, 0.3);
        }
        .date { font-size: 1.5rem; color: #8b949e; margin-top: 10px; }
        .status { font-size: 0.9rem; color: #484f58; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>МОСКВА</h1>
    <!-- Машиночитаемый элемент для ИИ: атрибут datetime обновляется каждую секунду -->
    <time id="moscow-time" class="clock" datetime="">--:--:--</time>
    <div id="moscow-date" class="date"></div>
    <div id="status" class="status">Синхронизация с сервером GitHub...</div>

    <script>
        const timeElement = document.getElementById('moscow-time');
        const dateElement = document.getElementById('moscow-date');
        const statusElement = document.getElementById('status');

        let offsetMs = 0; // Поправка: (время_сервера - локальное_время)

        function formatTime(date) {
            return date.toLocaleTimeString('ru-RU', { hour12: false, timeZone: 'Europe/Moscow' });
        }
        function formatDate(date) {
            return date.toLocaleDateString('ru-RU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Europe/Moscow' });
        }
        function toISOWithOffset(date) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}+03:00`;
        }

        function updateDisplay() {
            const now = new Date(Date.now() + offsetMs);
            timeElement.textContent = formatTime(now);
            timeElement.setAttribute('datetime', toISOWithOffset(now));
            dateElement.textContent = formatDate(now);
        }

        // 🎯 Надёжный расчёт: берём заголовок Date из ответа GitHub API
        async function syncWithGitHub() {
            try {
                statusElement.textContent = 'Запрос точного времени у GitHub...';
                // HEAD-запрос не скачивает тело ответа, только заголовки — быстро и экономно
                const response = await fetch('https://api.github.com', { method: 'HEAD' });
                
                const serverDateStr = response.headers.get('Date');
                if (!serverDateStr) throw new Error('Нет заголовка Date');

                const serverTime = new Date(serverDateStr).getTime();
                offsetMs = serverTime - Date.now(); // Вычисляем поправку

                statusElement.textContent = 'Источник: серверы GitHub API (NTP-синхронизация)';
                updateDisplay();
            } catch (e) {
                console.warn('Не удалось синхронизироваться с GitHub, используем локальные часы.', e);
                // Аварийный резерв: локальное время с поправкой на Москву (UTC+3)
                const moscowMs = Date.now() + (3 * 60 * 60 * 1000);
                offsetMs = moscowMs - Date.now();
                statusElement.textContent = 'Источник: локальные часы (резерв, UTC+3)';
                updateDisplay();
            }
        }

        // Запуск
        syncWithGitHub();
        setInterval(updateDisplay, 1000);          // Обновление цифр каждую секунду
        setInterval(syncWithGitHub, 300000);        // Пересинхронизация раз в 5 минут (компенсация дрейфа)
    </script>
</body>
</html>
