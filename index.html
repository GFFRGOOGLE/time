<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Точное московское время (UTC+3) в реальном времени">
    <title>Точное московское время</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
            background: #0d1117; color: #c9d1d9;
        }
        h1 { font-weight: 300; letter-spacing: 2px; color: #8b949e; }
        .clock {
            font-size: 6rem; font-variant-numeric: tabular-nums;
            font-weight: 700; color: #58a6ff;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.3);
        }
        .date { font-size: 1.5rem; color: #8b949e; margin-top: 10px; }
        .status { font-size: 0.85rem; color: #484f58; margin-top: 24px; }
    </style>
</head>
<body>

    <!-- ===== БЛОК ДЛЯ ИИ: читается парсерами без JS ===== -->
    <div id="ai-readable-time" style="display:none" aria-hidden="true">
        <p>Текущее московское время (UTC+3):</p>
        <time id="ai-time-element" datetime="1970-01-01T00:00:00+03:00">--:--:--</time>
        <p>Дата: <span id="ai-date-element">—</span></p>
    </div>
    <!-- ================================================== -->

    <!-- ===== ЖИВЫЕ ЧАСЫ ДЛЯ ЛЮДЕЙ ===== -->
    <h1>МОСКВА</h1>
    <div id="live-clock" class="clock">--:--:--</div>
    <div id="live-date" class="date"></div>
    <div id="source-status" class="status">Синхронизация...</div>

    <script>
        const liveClock = document.getElementById('live-clock');
        const liveDate  = document.getElementById('live-date');
        const statusEl  = document.getElementById('source-status');

        let offsetMs = 0;

        function updateDisplay() {
            const now = new Date(Date.now() + offsetMs);
            liveClock.textContent = now.toLocaleTimeString('ru-RU', {
                hour12: false, timeZone: 'Europe/Moscow'
            });
            liveDate.textContent = now.toLocaleDateString('ru-RU', {
                weekday: 'long', year: 'numeric',
                month: 'long', day: 'numeric',
                timeZone: 'Europe/Moscow'
            });
        }

        // --- Источник 1: time.now (Cloudflare, без ключей) ---
        async function tryTimeNow() {
            const res = await fetch('https://time.now/developer/api/timezone/Europe/Moscow');
            if (!res.ok) throw new Error('time.now error');
            const data = await res.json();
            // В ответе есть utc_datetime (ISO UTC)
            return new Date(data.utc_datetime).getTime();
        }

        // --- Источник 2: GotTimestamp (замена worldtimeapi) ---
        async function tryGotTimestamp() {
            const res = await fetch('https://gotimestamp.com/api/timezone/Europe/Moscow');
            if (!res.ok) throw new Error('gotimestamp error');
            const data = await res.json();
            // Используем unixtime (секунды)
            return data.unixtime * 1000;
        }

        // --- Источник 3: Cloudflare Trace (глобальная сеть) ---
        async function tryCloudflareTrace() {
            const res = await fetch('https://www.cloudflare.com/cdn-cgi/trace');
            if (!res.ok) throw new Error('cloudflare trace error');
            const text = await res.text();
            const match = text.match(/^ts=(\d+)$/m);
            if (!match) throw new Error('no ts in trace');
            return parseInt(match[1], 10) * 1000;
        }

        // --- Основная функция синхронизации с fallback ---
        async function syncTime() {
            statusEl.textContent = 'Поиск точного времени...';

            const sources = [
                { name: 'time.now', fn: tryTimeNow },
                { name: 'GotTimestamp', fn: tryGotTimestamp },
                { name: 'Cloudflare Trace', fn: tryCloudflareTrace }
            ];

            for (const src of sources) {
                try {
                    const serverMs = await src.fn();
                    offsetMs = serverMs - Date.now();
                    statusEl.textContent = `Источник: ${src.name} (UTC+3)`;
                    updateDisplay();
                    return;
                } catch (e) {
                    console.warn(`Источник ${src.name} недоступен:`, e);
                }
            }

            // Резерв: локальные часы + UTC+3
            const moscowMs = Date.now() + 3 * 60 * 60 * 1000;
            offsetMs = moscowMs - Date.now();
            statusEl.textContent = 'Источник: локальные часы (UTC+3, резерв)';
            updateDisplay();
        }

        // --- Запуск ---
        syncTime();
        setInterval(updateDisplay, 1000);      // тикаем каждую секунду
        setInterval(syncTime, 600000);        // пересинхронизация раз в 10 минут
    </script>
</body>
</html>
